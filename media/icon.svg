<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#3b2a52"/>
      <stop offset="0.6" stop-color="#1d1430"/>
      <stop offset="1" stop-color="#0b0814"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0b0"/>
      <stop offset="0.35" stop-color="#e2b04a"/>
      <stop offset="0.7" stop-color="#8a5a16"/>
      <stop offset="1" stop-color="#d9a640"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf0d2"/>
      <stop offset="1" stop-color="#d9c08a"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a2b1d"/>
      <stop offset="1" stop-color="#4a120b"/>
    </linearGradient>
    <linearGradient id="flask" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cf0ff"/>
      <stop offset="1" stop-color="#1b8fc0"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f2f2"/>
      <stop offset="0.5" stop-color="#a8aeb8"/>
      <stop offset="1" stop-color="#5d636e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe9a0" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffe9a0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- 배경과 금테 -->
  <rect x="0" y="0" width="400" height="400" rx="34" fill="url(#gold)"/>
  <rect x="14" y="14" width="372" height="372" rx="24" fill="#2a1a08"/>
  <rect x="20" y="20" width="360" height="360" rx="20" fill="url(#bg)"/>
  <circle cx="200" cy="215" r="150" fill="url(#glow)"/>

  <!-- 톱니바퀴 (왼쪽 위) -->
  <g transform="translate(108,112)">
    <g fill="url(#steel)" stroke="#2b2f36" stroke-width="4">
      <path d="M-9,-56 h18 l4,16 a42,42 0 0 1 14,6 l14,-9 13,13 -9,14 a42,42 0 0 1 6,14 l16,4 v18 l-16,4 a42,42 0 0 1 -6,14 l9,14 -13,13 -14,-9 a42,42 0 0 1 -14,6 l-4,16 h-18 l-4,-16 a42,42 0 0 1 -14,-6 l-14,9 -13,-13 9,-14 a42,42 0 0 1 -6,-14 l-16,-4 v-18 l16,-4 a42,42 0 0 1 6,-14 l-9,-14 13,-13 14,9 a42,42 0 0 1 14,-6 z"/>
    </g>
    <circle r="16" fill="#1d1430" stroke="#2b2f36" stroke-width="4"/>
  </g>

  <!-- 물약 병 (오른쪽 위) -->
  <g transform="translate(292,108) rotate(14)">
    <rect x="-12" y="-62" width="24" height="16" rx="4" fill="#8a5a16" stroke="#2b1a06" stroke-width="4"/>
    <path d="M-14,-46 h28 v28 l30,48 a22,22 0 0 1 -19,33 h-50 a22,22 0 0 1 -19,-33 l30,-48 z" fill="#d8f6ff" fill-opacity="0.35" stroke="#e8fbff" stroke-width="5"/>
    <path d="M-26,8 h52 l15,24 a14,14 0 0 1 -12,21 h-58 a14,14 0 0 1 -12,-21 z" fill="url(#flask)"/>
    <circle cx="-6" cy="26" r="5" fill="#ffffff" fill-opacity="0.8"/>
    <circle cx="9" cy="36" r="3" fill="#ffffff" fill-opacity="0.7"/>
  </g>

  <!-- 펼친 제조법 책 -->
  <g transform="translate(200,262)">
    <path d="M-150,-70 Q-75,-92 0,-66 Q75,-92 150,-70 L150,72 Q75,52 0,78 Q-75,52 -150,72 Z" fill="url(#cover)" stroke="#2a0a05" stroke-width="6"/>
    <path d="M-138,-74 Q-70,-94 -4,-70 L-4,62 Q-70,40 -138,60 Z" fill="url(#page)" stroke="#7a5a28" stroke-width="3"/>
    <path d="M138,-74 Q70,-94 4,-70 L4,62 Q70,40 138,60 Z" fill="url(#page)" stroke="#7a5a28" stroke-width="3"/>
    <!-- 왼쪽 쪽: 목록 줄 -->
    <g stroke="#8a6a3a" stroke-width="6" stroke-linecap="round">
      <line x1="-118" y1="-48" x2="-26" y2="-40"/>
      <line x1="-118" y1="-22" x2="-26" y2="-14"/>
      <line x1="-118" y1="4" x2="-26" y2="12"/>
      <line x1="-118" y1="30" x2="-56" y2="35"/>
    </g>
    <g fill="#c0392b">
      <circle cx="-128" cy="-49" r="5"/><circle cx="-128" cy="-23" r="5"/><circle cx="-128" cy="3" r="5"/><circle cx="-128" cy="29" r="5"/>
    </g>
    <!-- 오른쪽 쪽: 망치 -->
    <g transform="translate(70,-6) rotate(-35)">
      <rect x="-5" y="-6" width="10" height="68" rx="4" fill="#8a5a16" stroke="#3a2306" stroke-width="3"/>
      <rect x="-28" y="-26" width="56" height="24" rx="5" fill="url(#steel)" stroke="#2b2f36" stroke-width="4"/>
    </g>
    <line x1="0" y1="-68" x2="0" y2="76" stroke="#3a1206" stroke-width="5"/>
  </g>

  <!-- 반짝임 -->
  <g fill="#fff6c8">
    <path d="M200,62 l7,20 20,7 -20,7 -7,20 -7,-20 -20,-7 20,-7z"/>
    <path d="M330,200 l4,11 11,4 -11,4 -4,11 -4,-11 -11,-4 11,-4z" fill-opacity="0.8"/>
    <path d="M62,214 l4,11 11,4 -11,4 -4,11 -4,-11 -11,-4 11,-4z" fill-opacity="0.8"/>
  </g>
</svg>
